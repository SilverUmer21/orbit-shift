<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#08151c"><title>Orbit Shift</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell">
<canvas id="game" aria-label="Orbit Shift game area"></canvas>
<header class="hud"><div><span>Score</span><strong id="score">0</strong></div><div class="combo"><span>Flow</span><strong id="multiplier">x1</strong></div><div><span>Best</span><strong id="best">0</strong></div></header><div class="fever"><i id="feverBar"></i></div>
<section id="home" class="screen home"><div class="brand"><p class="eyebrow">A tiny world in motion</p><h1>Orbit<br>Shift</h1></div><canvas id="riderPreview" class="rider-preview" width="260" height="150" aria-label="Selected glider preview"></canvas><div class="home-stats"><span>Best <b id="homeBest">0</b></span><span>Stars <b id="homeStars">0</b></span></div><button id="play" class="primary" type="button">Play</button><div class="menu-row"><button id="openGarage" type="button">Garage</button><button id="openSettings" type="button">Settings</button></div></section>
<section id="garage" class="screen drawer" hidden><header><button class="back" data-home type="button" aria-label="Back">&#8592;</button><div><p class="eyebrow">Collection</p><h2>Garage</h2></div><strong id="garageStars">0 stars</strong></header><div id="riderGrid" class="rider-grid"></div><div class="biome-picker"><p class="eyebrow">World palette</p><div id="cosmetics" class="cosmetics" aria-label="Biome selector"></div></div></section>
<section id="settings" class="screen drawer" hidden><header><button class="back" data-home type="button" aria-label="Back">&#8592;</button><div><p class="eyebrow">Preferences</p><h2>Settings</h2></div></header><div class="setting-list"><label><span><b>Sound</b><small>Reversals, flow and impacts</small></span><input id="soundToggle" type="checkbox"></label><label><span><b>Haptics</b><small>Short supported-device vibrations</small></span><input id="hapticsToggle" type="checkbox"></label><label><span><b>Reduced effects</b><small>Fewer particles and less shake</small></span><input id="effectsToggle" type="checkbox"></label></div></section>
<section id="results" class="screen results" hidden><p class="eyebrow">Orbit broken</p><h2 id="resultScore">0</h2><p id="resultStats" class="copy">Best flow x1</p><div class="earned"><span>Run reward</span><strong id="resultStars">+0 stars</strong></div><p id="recordText" class="record"></p><p id="unlockText" class="unlock"></p><button id="retry" class="primary" type="button">Again</button><button id="resultHome" class="secondary" type="button">Home</button></section>
</main><script src="game.js"></script></body></html>
